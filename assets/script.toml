# VN script file (TOML)

# -------------------- GAME / TITLE SCREEN METADATA --------------------

[game]
title = "Tangents"
version = "0.1.0"
company = "Vine Street Labs"

[window]
width = 1920
height = 1080

[fonts]
ui = "fonts/Roboto_Condensed-Regular.ttf"

[title_screen]
background = "images/environments/lab.png"
logo = ""
start_button_text = "Start"
hint_text = "Click Start or press Enter"

bgm = ""
bgm_loop = true
bgm_volume = 55

[meta]
girls = ["Annie", "Mia", "Reina", "Sara", "Yumi"]
chapter_thresholds = [6, 14, 22, 30, 38]

# -------------------- FEATURE 1: Game State Initialization --------------------
[initial_state]
variables = {Annie_affection = 0, Mia_affection = 0, Reina_affection = 0}
flags = []

# -------------------- CHAPTER 1 - THE DINER --------------------

[start]
chapter = 1
speaker = "???"
bg = "images/environments/Diner.png"
dialogue = [
  "The bell above the door goes *ding*... welcoming you into the cool jazz filled diner.",
  "Three girls stand there looking at you.",
  "\"Welcome!\" Mia chirps, readjusting her hockey jersey. Annie's eyes narrow. Reina smiles and puts a hammer back into her purse.",
  "A fourth stool is empty. A fifth place setting sits under a napkin, untouched."
]
bgm = "sfx/bgm/anime_piano_daytime_loop.wav"
bgm_loop = true
bgm_volume = 58

[[start.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[start.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[start.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

[[start.choices]]
key = "A"
text = "Sit Down at Table."
next = "ch1_intro_1"
sfx = "sfx/clicks/sfx_select.wav"


# -------------------- SCENE 1: Mia's Welcome --------------------

[ch1_intro_1]
chapter = 1
speaker = "Mia"
bg = "images/environments/Diner.png"
dialogue = "\"Table for one? Or are you secretly five people in a trench coat?\""
description = [
  "She says it with infectious warmth, but her eyes study you carefully.",
  "There's something playful in her smile—like she's testing you."
]

[[ch1_intro_1.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_intro_1.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[ch1_intro_1.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

[[ch1_intro_1.choices]]
key = "A"
text = "Play along: \"Definitely a trench coat situation.\""
next = "ch1_intro_2"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Mia_affection = 5}
set_flags = ["chose_humor"]

[[ch1_intro_1.choices]]
key = "B"
text = "Be earnest: \"Just me. Thanks for the warm welcome.\""
next = "ch1_intro_2"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Annie_affection = 4}
set_flags = ["chose_sincere"]

[[ch1_intro_1.choices]]
key = "C"
text = "Confident: \"I've been here before. I know everyone.\""
next = "ch1_mysterious"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Reina_affection = 4, Mia_affection = 2}
set_flags = ["chose_bold"]


# -------------------- SCENE 2a: Annie's Test --------------------

[ch1_intro_2]
chapter = 1
speaker = "Annie"
bg = "images/environments/Diner.png"
dialogue = "\"Sit. Don't make it weird.\""
description = [
  "Annie's tone is sharp, but not unkind. She slides the stool toward you with her boot."
]
next = "ch1_coffee"

[[ch1_intro_2.chars]]
file = "images/characters/Annie_Mad.png"
pos = "left"
z = 1

[[ch1_intro_2.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 0

[[ch1_intro_2.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2


# -------------------- SCENE 2b: Reina's Mystery --------------------

[ch1_mysterious]
chapter = 1
speaker = "Reina"
bg = "images/environments/Diner.png"
dialogue = "\"Interesting. You've never been here before.\""
description = [
  "Reina sets down her tools with deliberate precision.",
  "\"But you're good at reading people. I like that.\""
]
next = "ch1_coffee"

[[ch1_mysterious.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_mysterious.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 0

[[ch1_mysterious.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 1


# -------------------- SCENE 3: Coffee & Conversation --------------------

[ch1_coffee]
chapter = 1
speaker = "Mia"
bg = "images/environments/Diner.png"
dialogue = "\"So... what's your story?\""
description = [
  "Mia slides a cup of coffee in front of you. It's hot and smells incredible.",
  "\"You walked in here like you knew exactly what you were looking for.\""
]

[[ch1_coffee.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_coffee.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[ch1_coffee.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

[[ch1_coffee.choices]]
key = "A"
text = "Tell the truth: \"I'm running from something.\""
next = "ch1_connection"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Mia_affection = 3, Annie_affection = 2}
set_flags = ["chose_honest"]

[[ch1_coffee.choices]]
key = "B"
text = "Stay mysterious: \"Just passing through.\""
next = "ch1_standoff"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Reina_affection = 3}

[[ch1_coffee.choices]]
key = "C"
text = "Deflect with humor: \"Great coffee. That's my story.\""
next = "ch1_connection"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Mia_affection = 4}


# -------------------- SCENE 4a: Connection --------------------

[ch1_connection]
chapter = 1
speaker = "Mia"
bg = "images/environments/Diner.png"
dialogue = "\"You know... I think you're going to fit in just fine here.\""
description = [
  "Mia leans against the counter, and for the first time, her guard drops.",
  "Annie even cracks the smallest smile in the corner. Reina nods approvingly.",
  "The diner feels warmer somehow. Like you've found something you didn't know you were looking for."
]
next = "ch1_ending_good"

[[ch1_connection.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_connection.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[ch1_connection.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2


# -------------------- SCENE 4b: Standoff --------------------

[ch1_standoff]
chapter = 1
speaker = "Reina"
bg = "images/environments/Diner.png"
dialogue = "\"I respect that. A person should have secrets.\""
description = [
  "Annie crosses her arms, clearly skeptical of your answer.",
  "Mia tries to keep the conversation flowing, but the moment of warmth has passed.",
  "You're accepted... but not trusted. Not yet, anyway."
]
next = "ch1_ending_neutral"

[[ch1_standoff.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 1

[[ch1_standoff.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 0

[[ch1_standoff.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2


# -------------------- CONDITIONAL SCENE: Based on Affection --------------------

[ch1_decision]
chapter = 1
speaker = "Mia"
bg = "images/environments/Diner.png"
dialogue = "\"We're having a gathering tomorrow. You should come.\""
description = [
  "The offer hangs in the air. All three of them are looking at you, waiting for your answer."
]

[[ch1_decision.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_decision.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[ch1_decision.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

[[ch1_decision.choices]]
key = "A"
text = "Accept eagerly: \"I'd love to!\""
next = "ch1_ending_good"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Mia_affection = 2, Annie_affection = 1, Reina_affection = 1}
conditions = ["Mia_affection >= 5"]

[[ch1_decision.choices]]
key = "B"
text = "Accept cautiously: \"Maybe. Tell me more first.\""
next = "ch1_ending_neutral"
sfx = "sfx/clicks/sfx_select.wav"
set_vars = {Mia_affection = 1}

[[ch1_decision.choices]]
key = "C"
text = "Decline: \"I should get going.\""
next = "ch1_ending_bad"
sfx = "sfx/clicks/sfx_select.wav"


# -------------------- ENDING 1: Good End (High Affection) --------------------

[ch1_ending_good]
chapter = 1
speaker = "Narrator"
bg = "images/environments/Diner.png"
dialogue = [
  "",
  "★ ENDING: NEW FRIENDS ★",
  "You've made genuine connections with Annie, Mia, and Reina.",
  "The diner feels less like a strangers' gathering... and more like home.",
  "This is just the beginning of an unexpected adventure.",
  ""
]
bgm = "sfx/bgm/anime_piano_daytime_loop.wav"
next = "end"

[[ch1_ending_good.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_ending_good.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[ch1_ending_good.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2


# -------------------- ENDING 2: Neutral End (Medium Affection) --------------------

[ch1_ending_neutral]
chapter = 1
speaker = "Narrator"
bg = "images/environments/Diner.png"
dialogue = [
  "",
  "★ ENDING: INTERESTING STRANGER ★",
  "You're an intriguing presence in their world.",
  "They're willing to see where this goes... but you haven't earned their trust yet.",
  "Time will tell what happens next.",
  ""
]
bgm = "sfx/bgm/anime_piano_daytime_loop.wav"
next = "end"

[[ch1_ending_neutral.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_ending_neutral.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 0

[[ch1_ending_neutral.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2


# -------------------- ENDING 3: Bad End (Low Affection) --------------------

[ch1_ending_bad]
chapter = 1
speaker = "Narrator"
bg = "images/environments/Diner.png"
dialogue = [
  "",
  "★ ENDING: MISSED CONNECTION ★",
  "You left the diner as quickly as you arrived.",
  "Annie watches you go with indifference. Mia sighs softly.",
  "Reina returns to her work, already forgetting your face.",
  "The diner door closes behind you... perhaps for the last time.",
  ""
]
bgm = "sfx/bgm/anime_piano_daytime_loop.wav"
next = "end"

[[ch1_ending_bad.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_ending_bad.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[ch1_ending_bad.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2


# -------------------- ENDING (Game Over) --------------------

[end]
chapter = 1
speaker = "Narrator"
bg = "images/environments/Diner.png"
dialogue = [
  " ",
  "Thanks for playing TANGENTS!",
  " ",
  "~ The End ~"
]
next = "end"

[[end.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[end.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[end.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2
