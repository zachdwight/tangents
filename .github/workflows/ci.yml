name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        brew install sfml llvm catch2 clang-format

    - name: Build
      run: make build

    - name: Lint
      run: make lint

    - name: Run tests
      run: make test

    - name: Format check
      run: clang-format --dry-run -i src/*.cpp include/*.h tests/*.cpp
