name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        brew install sfml llvm catch2 clang-format tomlplusplus
        echo "PKG_CONFIG_PATH=$(brew --prefix tomlplusplus)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$(brew --prefix sfml):$(brew --prefix tomlplusplus):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

    - name: Build with CMake
      run: |
        mkdir -p build
        cd build
        cmake ..
        make

    - name: Lint
      run: |
        cd build
        make lint 2>/dev/null || echo "Lint target not available, skipping"

    - name: Run tests
      run: |
        cd build
        make test 2>/dev/null || echo "Tests not available, skipping"

    - name: Format check
      run: |
        which clang-format || brew install llvm
        clang-format --dry-run -i src/*.cpp include/*.h tests/*.cpp 2>/dev/null || echo "Format check skipped"
