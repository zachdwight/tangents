# VN script file (TOML)

# -------------------- GAME / TITLE SCREEN METADATA --------------------

[game]
title = "Tangents"
version = "0.1.0"
company = "Vine Street Labs"

[window]
width = 1920
height = 1080

[fonts]
# UI font used for title screen + in-game text
# ui = "fonts/Delius-Regular.ttf" #cutesy font

ui = "fonts/Roboto_Condensed-Regular.ttf"

[title_screen]
# Optional. If missing/empty or the file doesn't exist, the title screen still works.
background = "images/environments/lab.png"
logo = ""
start_button_text = "Start"
hint_text = "Click Start or press Enter"

# Optional title music (leave empty to disable)
bgm = ""
bgm_loop = true
bgm_volume = 55

[meta]
girls = ["Annie", "Mia", "Reina", "Sara", "Yumi"]
chapter_thresholds = [6, 14, 22, 30, 38]

# -------------------- CHAPTER 1 --------------------

[start]
chapter = 1
speaker = "???"
bg = "images/environments/Diner.png"
dialogue = [
  "The bell above the door goes *ding*... welcoming you into the cool jazz filled diner.",
  "Three girls stand there looking at you.",
  "\"Welcome!\" Mia chirps, readjusting her hockey jersey. Annie's eyes narrow. Reina smiles and puts a hammer back into her purse.",
  "A fourth stool is empty. A fifth place setting sits under a napkin, untouched."
]
bgm = "sfx/bgm/anime_piano_daytime_loop.wav"
bgm_loop = true
bgm_volume = 58
next = "ch1_intro_1"

[[start.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[start.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[start.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

[[start.choices]]
key = "A"
text = "Sit Down at Table."
next = "ch1_intro_1"
sfx = "sfx/clicks/sfx_select.wav"


[ch1_intro_1]
chapter = 1
speaker = "Mia"
bg = "images/environments/Diner.png"
dialogue = [
  "\"Table for one? Or are you secretly five people in a trench coat?\"",
  "She says it like a joke, but her smile waits too patiently for your answer.",
  "Annie elbows a sugar caddy so it clinks. Reina's gaze flicks to the basement door, then back to you."
]

[[ch1_intro_1.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[ch1_intro_1.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[ch1_intro_1.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

[[ch1_intro_1.choices]]
key = "A"
text = "Play along: \"Definitely a trench coat situation.\""
next = "ch1_intro_2"
sfx = "sfx/clicks/sfx_select.wav"

[[ch1_intro_1.choices]]
key = "B"
text = "Be polite: \"Just me. But thanks for the welcome.\""
next = "ch1_intro_2"
sfx = "sfx/clicks/sfx_select.wav"

[[ch1_intro_1.choices]]
key = "C"
text = "Ignore the joke and ask for a menu."
next = "ch1_intro_2"
sfx = "sfx/clicks/sfx_select.wav"


[ch1_intro_2]
chapter = 1
speaker = "Annie"
bg = "images/environments/Diner.png"
dialogue = [
  "\"Sit.\" Annie points at the counter stool like she owns it.",
  "\"Don't make it weird.\""
]

[[ch1_intro_2.chars]]
file = "images/characters/Annie_Mad.png"
pos = "left"
z = 1

[[ch1_intro_2.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 0

[[ch1_intro_2.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

# TODO: wire to the next written scene
next = "end"


# -------------------- END (placeholder) --------------------

[end]
chapter = 1
speaker = "Narrator"
bg = "images/environments/Diner.png"
dialogue = [
  "— To be continued —"
]

[[end.chars]]
file = "images/characters/Annie.png"
pos = "left"
z = 0

[[end.chars]]
file = "images/characters/Mia.png"
pos = "center"
z = 1

[[end.chars]]
file = "images/characters/Reina.png"
pos = "right"
z = 2

